server.port=8080
spring.application.name=vedant-portfolio-backend

# PostgreSQL Connection (Replace with Supabase / Neon / Local URI)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vedant_portfolio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS allowed origins (comma-separated)
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,https://vedantjakarwar.com,https://www.vedantjakarwar.com
